global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'users-service'
    static_configs:
      - targets: ['users-service:5001']
    metrics_path: /metrics

  - job_name: 'events-service'
    static_configs:
      - targets: ['events-service:5002']
    metrics_path: /metrics

  - job_name: 'bookings-service'
    static_configs:
      - targets: ['bookings-service:5003']
    metrics_path: /metrics
